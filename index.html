<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Budget Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="container">
            <h1>Budget Calculator</h1>
            <p>Build a conservative monthly budget.</p>

            <form id="budget-form">
                <label for="income">Monthly take-home income ($)</label>
                <input
                type="number"
                id="income"
                placeholder="6767"
                min="0"
                step=".01"
                required
            >

<div class="plan-selector">
  <p>Choose your budgeting style:</p>

  <div class="plan-buttons">
    <button type="button" class="plan-button" data-plan="fun">
      I love fun
    </button>

    <button type="button" class="plan-button selected" data-plan="balanced">
      I want a balance
    </button>

    <button type="button" class="plan-button" data-plan="responsible">
      I hate fun
    </button>
  </div>
</div>
            <button type="submit">Generate Budget</button>
            </form>
            <section id="results" hidden>
                <h2>Your Monthly Budget</h2>
                <div id="budget-breakdown"></div>
                <p id="total"></p>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
